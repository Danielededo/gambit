<?xml version="1.0" encoding="UTF-8"?><!--
Medieval piece set for Gambit: angular heraldic shapes
(shield pawn, tower rook, horse knight, mitre bishop, crowns).
Original artwork created for this project. License: MIT (same as the project).
Each piece is a 40x40 tile addressed by id (wk, wq, wr, wb, wn, wp, bk, ...).
-->
