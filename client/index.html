<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gambit — Chess Game</title>
  <meta name="description" content="Interactive chess game. Play against the AI or a friend on the same device." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♞</text></svg>" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/themes/light.css" id="theme-stylesheet" />
  <script>
    // Apply the saved theme before first paint to avoid a flash of the default theme.
    try {
      var savedTheme = localStorage.getItem("gambit-theme");
      if (savedTheme && ["light", "dark", "blue", "sepia"].indexOf(savedTheme) !== -1) {
        document.getElementById("theme-stylesheet").href = "styles/themes/" + savedTheme + ".css";
      }
    } catch (e) { /* localStorage unavailable */ }
  </script>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">♞ Gambit</h1>
    <div class="app-controls">
      <label class="control-field">
        <span class="control-label">Mode</span>
        <select id="mode-select">
          <option value="ai" selected>Human vs AI</option>
          <option value="human">Human vs Human</option>
          <option value="online">Online (PIN)</option>
        </select>
      </label>
      <label class="control-field" id="difficulty-field">
        <span class="control-label">Difficulty <span id="difficulty-value">3</span></span>
        <input type="range" id="difficulty" min="1" max="8" step="1" value="3" />
      </label>
      <label class="control-field">
        <span class="control-label">Theme</span>
        <select id="theme-select"></select>
      </label>
      <label class="control-field">
        <span class="control-label">Pieces</span>
        <select id="piece-set-select"></select>
      </label>
      <button id="reset-button" class="btn" type="button">New game</button>
    </div>
  </header>

  <main class="app-main">
    <section class="board-panel" aria-label="Chessboard">
      <div id="board" class="board" role="grid" aria-label="Chessboard 8 by 8"></div>
    </section>

    <aside class="sidebar" aria-label="Game information">
      <div id="online-panel" class="online-panel" hidden>
        <button id="create-game" class="btn" type="button">Create game</button>
        <div class="join-row">
          <input id="join-pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-digit PIN" aria-label="Game PIN" />
          <button id="join-game" class="btn" type="button">Join</button>
        </div>
        <p class="online-hint">Create a game and share the PIN, or enter a friend's PIN to join.</p>
      </div>
      <div id="pin-banner" class="pin-banner" hidden>PIN <strong id="pin-value"></strong></div>
      <div id="game-status" class="game-status" role="status">White to move</div>
      <h2 class="sidebar-heading">Moves</h2>
      <ol id="move-history" class="move-history"></ol>
    </aside>
  </main>

  <footer class="app-footer">
    <p>Gambit — open source chess, MIT licensed. Engine: Stockfish (GPLv3). Play against the AI or a friend on the same device.</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
