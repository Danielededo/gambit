<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gambit — Chess Game</title>
  <meta name="description" content="Free online chess. Challenge a friend with a game PIN, play against Stockfish, or share a board on the same device." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Gambit — Chess Game" />
  <meta property="og:description" content="You're invited to play chess! Join with the game PIN, or play against Stockfish. Free, no account needed." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Gambit — Chess Game" />
  <meta name="twitter:description" content="You're invited to play chess! Join with the game PIN, or play against Stockfish. Free, no account needed." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♞</text></svg>" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/themes/light.css" id="theme-stylesheet" />
  <script>
    // Apply the saved theme before first paint to avoid a flash of the default theme.
    try {
      var savedTheme = localStorage.getItem("gambit-theme");
      if (savedTheme && ["light", "dark", "blue", "sepia"].indexOf(savedTheme) !== -1) {
        document.getElementById("theme-stylesheet").href = "styles/themes/" + savedTheme + ".css";
      }
    } catch (e) { /* localStorage unavailable */ }
  </script>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">♞ Gambit</h1>
    <div class="app-controls">
      <label class="control-field">
        <span class="control-label">Mode</span>
        <select id="mode-select">
          <option value="ai" selected>Human vs AI</option>
          <option value="human">Human vs Human</option>
          <option value="online">Online (PIN)</option>
        </select>
      </label>
      <label class="control-field" id="difficulty-field">
        <span class="control-label">Difficulty <span id="difficulty-value">3</span></span>
        <input type="range" id="difficulty" min="1" max="8" step="1" value="3" />
      </label>
      <label class="control-field">
        <span class="control-label">Theme</span>
        <select id="theme-select"></select>
      </label>
      <label class="control-field">
        <span class="control-label">Pieces</span>
        <select id="piece-set-select"></select>
      </label>
      <button id="sound-toggle" class="btn btn-icon" type="button" aria-label="Toggle sounds" title="Toggle sounds">🔊</button>
      <button id="reset-button" class="btn" type="button">New game</button>
    </div>
  </header>

  <main class="app-main">
    <section class="board-panel" aria-label="Chessboard">
      <div id="board" class="board" role="grid" aria-label="Chessboard 8 by 8"></div>
      <div id="board-toast" class="board-toast" hidden aria-live="assertive">
        <span id="board-toast-text"></span>
      </div>
    </section>

    <aside class="sidebar" aria-label="Game information">
      <div id="online-panel" class="online-panel" hidden>
        <button id="create-game" class="btn" type="button">Create game</button>
        <div class="join-row">
          <input id="join-pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-digit PIN" aria-label="Game PIN" />
          <button id="join-game" class="btn" type="button">Join</button>
        </div>
        <p class="online-hint">Create a game and share the PIN, or enter a friend's PIN to join.</p>
      </div>
      <div id="pin-banner" class="pin-banner" hidden>
        PIN <strong id="pin-value"></strong>
        <button id="copy-pin" class="copy-pin" type="button" aria-label="Copy PIN" title="Copy PIN">
          <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
        <button id="share-pin" class="copy-pin" type="button" aria-label="Share invite link" title="Share invite link">
          <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
      </div>
      <div id="game-status" class="game-status" role="status">White to move</div>
      <div id="offer-banner" class="offer-banner" hidden>
        <span id="offer-text"></span>
        <div class="offer-actions">
          <button id="offer-accept" class="btn btn-small" type="button">Accept</button>
          <button id="offer-decline" class="btn btn-small btn-secondary" type="button">Decline</button>
        </div>
      </div>
      <div id="online-actions" class="online-actions" hidden>
        <button id="draw-button" class="btn btn-small btn-secondary" type="button">Offer draw</button>
        <button id="rematch-button" class="btn btn-small" type="button" hidden>Rematch</button>
      </div>
      <h2 class="sidebar-heading">Captured</h2>
      <div id="captured-panel" class="captured-panel">
        <div class="captured-row">
          <span class="captured-label">White</span>
          <span id="captured-by-w" class="captured-pieces"></span>
          <span id="material-w" class="material-lead"></span>
        </div>
        <div class="captured-row">
          <span class="captured-label">Black</span>
          <span id="captured-by-b" class="captured-pieces"></span>
          <span id="material-b" class="material-lead"></span>
        </div>
      </div>
      <details class="moves-details">
        <summary class="sidebar-heading">Moves</summary>
        <ol id="move-history" class="move-history"></ol>
      </details>
      <section id="chat-panel" class="chat-panel" hidden aria-label="Game chat">
        <h2 class="sidebar-heading">Chat</h2>
        <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" maxlength="500" placeholder="Message…" autocomplete="off" aria-label="Chat message" />
          <button class="btn btn-small" type="submit">Send</button>
        </form>
      </section>
    </aside>
  </main>

  <footer class="app-footer">
    <p>
      Gambit — open source chess, MIT licensed · Engine: Stockfish (GPLv3) ·
      <a class="footer-link" href="https://github.com/Danielededo/gambit" target="_blank" rel="noopener noreferrer">
        <svg class="github-mark" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        Source on GitHub</a>
      · <span id="app-version" class="app-version"></span>
    </p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
